services:
  - type: web
    name: revops-ai
    runtime: docker
    dockerfilePath: RevOpsAI/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DASHBOARD_AUTH_ENABLED
        value: "false"
      - key: DASHBOARD_USERNAME
        value: admin@hzsaas.com
      - key: DASHBOARD_PASSWORD
        value: HzSaaS2026!
      - key: CRON_SECRET_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false

